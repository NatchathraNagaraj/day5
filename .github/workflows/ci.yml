name: CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check app.sh
        run: bash -n app.sh

      - name: Run application
        run: ./app.sh
      - name: Test application output
        run: |
          ./app.sh > output.txt
          grep -q "DevOps" output.txt
